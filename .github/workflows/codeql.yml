---
name: "CodeQL Scan for GitHub Actions Workflows"

on:
  push:
    branches: [master]
    paths: [".github/workflows/**"]
  pull_request:
    branches: [master]
    paths: [".github/workflows/**"]

jobs:
  analyze:
    name: Analyze GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: actions

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: actions
